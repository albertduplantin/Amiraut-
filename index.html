<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Caca Prout</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #f4f4f4;
      gap: 24px;
    }
    button {
      font-size: 1.5rem;
      padding: 16px 32px;
      border: none;
      border-radius: 12px;
      background: #6b4f2a;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #543d20;
    }
    #resultat {
      font-size: 3rem;
      font-weight: bold;
      min-height: 4rem;
    }
  </style>
</head>
<body>
  <button id="bouton">Appuie ici</button>
  <div id="resultat"></div>

  <script>
    document.getElementById('bouton').addEventListener('click', () => {
      document.getElementById('resultat').textContent = 'caca prout';
    });
  </script>
</body>
</html>
